[workspace]
resolver = "2"
members = ["crates/numerics", "crates/pybind"]

[workspace.package]
# THE version of numerics-lab: maturin reads it for the Python package, and a release tag must match.
version = "0.1.0"
edition = "2021"
license = "MIT"
# faer 0.24.4 declares rust-version 1.84.
rust-version = "1.84"

[workspace.dependencies]
numerics = { path = "crates/numerics" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.lints.clippy.all]
level = "deny"
priority = -1

[workspace.lints.clippy.pedantic]
level = "warn"
priority = -1
[profile.release]
lto = true
codegen-units = 1
