[package]
name = "gauss"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Mirrors `src/motronics/gauss/` -- the physics-free numerical engine, the LEAF of the crate DAG:
# it depends on no workspace crate, so it can leave the workspace as `numerics-lab` unchanged.
# Enforced by crates/contracts/tests/crate_dag.rs.
[dependencies]
# Direct sparse LU (ruling D4 -- scipy may be replaced). Pure Rust, no SuiteSparse build step.
# It is faer that raises the workspace rust-version floor to 1.84; see ../../Cargo.toml.
faer = { version = "0.24.4", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
