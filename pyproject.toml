[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "numerics-lab"
# The version is the Cargo workspace's (`Cargo.toml`), read by maturin; a release tag must match it.
dynamic = ["version"]
description = "Equation-solving numerics: linear and nonlinear solves, time integration (Python + Rust)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Mingyang Bao" }]
# Runtime numerics depend only on numpy and scipy's linalg/sparse/special (plan ruling R1).
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.7",
    "pytest",
    "pytest-xdist",
    "ruff",
    # The shared development kit (verify door, rules). DEV ONLY: the engine imports no lab_commons.
    "lab-commons[dev] @ git+https://gitea.mingyangbao.site/Tianjie-Zou-Team/lab-commons.git",
]

[tool.maturin]
python-source = "python"
module-name = "numerics_lab._native"
manifest-path = "crates/pybind/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# uv keys a path build on pyproject.toml's mtime alone; a Rust edit must rebuild the extension.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["."]
xfail_strict = true
markers = [
    "unit: fast unit tests",
    "timeout: per-test ceiling (pytest-timeout)",
    "dev_checkout: asserts a developer-checkout invariant (hooks installed, branches on origin, worktree placement)",
]


[tool.lab_commons.hpc]
# PIN + FRESHNESS (user ruling 2026-10-17): the venv is exactly the committed lock, and the lock keys it.
install = 'uv sync --frozen --extra dev'
dependency_inputs = ['pyproject.toml', 'uv.lock']
source_roots = ['python']
needs = ['cargo', 'cc']  # the maturin build compiles the Rust extension
collect = 'tests'

[tool.lab_commons.parts]
output = "output/logs"

[tool.lab_commons.tests]
produce = ["-m", "lab_commons.dev.verify", "--part", "{part}"]
resources = ["dev_checkout"]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# on a full forge PASS. integrate/main is cut at main's tip at adoption, so every commit after it is a merge.
[tool.lab_commons.integrator]
trunk = "main"
integration = "integrate/main"
merges_only_since = "9f16d44091d99eb53dbdb7177eba5ad462d8764f"  # INTEGRATION-IS-MERGES-ONLY from here on

# Git hooks: the family base (lab_commons/dev/githooks/base.toml) as is; numerics-lab adds no row.
[tool.lab_commons.hooks]

[tool.lab_commons.branchset]
trunk = 'main'
sessions = ['integrate/main']
prune_merged = true

[tool.lab_commons.doors]
BARE-TEST-INVOCATION = "<venv python> -m lab_commons.dev.verify -- <paths>  (the measure door; a full run is the forge producer's; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "push without skipping the hook; no hook runs a test, and the forge produces the part"
GIT-NETWORK-VERB = "<venv python> -m lab_commons.dev.netverb -- git <push|fetch|pull|clone|ls-remote> ...  (retries 3x, then reports a diagnosis)"
ENV-MUTATION-THROUGH-THE-DOOR = "<any family venv python> -m lab_commons.dev.dep --bootstrap <this checkout> --extra dev  (run from this checkout)"
